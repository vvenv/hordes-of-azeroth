# Settings that differ from server/run/realmd.conf.dist.
# tools/apply-config.ps1 merges these into server/run/realmd.conf.

LogsDir = "../logs"

# Single-player: only reachable from this machine.
BindIP = "127.0.0.1"

# HordesOfAzeroth.exe is a patched WoW.exe, so its integrity hash no longer
# matches the stock build's. The server only listens on 127.0.0.1.
StrictVersionCheck = 0

# A fresh client asks for the realm list twice in the same second; with the
# default throttle the second request is dropped and the login hangs on
# "Retrieving realm list".
MinRealmListDelay = 0

# Classic: its own account database, beside the old survivors one.
LoginDatabaseInfo = "127.0.0.1;3306;mangos;mangos;classic_realmd"
